# Install this file as /etc/nginx/sites-available/pncteamstartup.site.
# Certbot can add the HTTPS server block and redirect after HTTP succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name pncteamstartup.site www.pncteamstartup.site;

    root /var/www/html/PNC-TEAM-STARTUP/out;
    index index.html;

    # Lets Certbot complete HTTP-01 certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Older deployed links used /en and /km. Send them to real static routes.
    # Language choice is now stored in the visitor's browser, so Next.js does
    # not attempt to fetch non-existent locale RSC files such as /en.txt.
    location ~ ^/(?:en|km)/?$ {
        return 302 /;
    }

    location ~ ^/(?:en|km)/(.*)$ {
        return 302 /$1;
    }

    # Next.js static export writes route pages as files (for example,
    # /projects.html). Resolve a trailing slash to that file before Nginx
    # treats /projects/ as a directory and returns 403.
    location ~ ^/(.+)/$ {
        try_files /$1.html =404;
    }

    location / {
        try_files $uri.html $uri =404;
    }
}
