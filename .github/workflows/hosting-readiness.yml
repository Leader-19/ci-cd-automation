name: Hosting readiness

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-export:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://pncteamstartup.site
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build static Nginx export
        run: npm run build
