# Install this file as /etc/nginx/sites-available/pncteamstartup.site.
# Certbot can add the HTTPS server block and redirect after HTTP succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name pncteamstartup.site www.pncteamstartup.site;

    root /var/www/pncteamstartup.site/current;
    index index.html;

    # Lets Certbot complete HTTP-01 certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # The exported files do not contain /en or /km directories. This mapping
    # preserves the app's localized public URLs, such as /km/team/chhea-chhouy.
    location ~ ^/(?:en|km)$ {
        try_files /index.html =404;
    }

    location ~ ^/(?:en|km)/(.*)$ {
        try_files /$1 /$1/ /$1.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
