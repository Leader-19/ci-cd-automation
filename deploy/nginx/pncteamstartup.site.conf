server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ACME challenge (optional, useful if you later add cert-manager)
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Redirect old language paths
    location ~ ^/(?:en|km)/?$ {
        return 302 /;
    }

    location ~ ^/(?:en|km)/(.*)$ {
        return 302 /$1;
    }

    # Handle trailing slash → .html
    location ~ ^/(.+)/$ {
        try_files /$1.html =404;
    }

    # Main location
    location / {
        try_files $uri.html $uri $uri/ /index.html =404;
    }

    # Cache static assets from Next.js
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}